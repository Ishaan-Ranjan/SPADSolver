[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spadsolver"
version = "0.1.0"
description = "SPAD solver numerical core (Python port)"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ray = ["ray>=2.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spadsolver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
